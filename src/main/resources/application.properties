# Application identity
quarkus.application.name=demo-quarkus-langchaing4j

# HTTP
quarkus.http.port=8080
quarkus.http.root-path=/

# Jackson (via quarkus-rest-jackson)
quarkus.jackson.fail-on-unknown-properties=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."pe.com.incoda.demoquarkuslangchaing4j".level=DEBUG

%dev.quarkus.log.console.json=false
%test.quarkus.log.console.json=false

# ---------------------------------------------------------------------------
# LangChain4j - Google Gemini (quarkus-langchain4j-ai-gemini)
# ---------------------------------------------------------------------------
# Set the real API key through the GEMINI_API_KEY environment variable, e.g.:
#   export GEMINI_API_KEY=your-key
# The default is a NON-SENSITIVE placeholder so the app stays startable without a
# key; model calls fail until a valid key is provided. Never commit a real key.
quarkus.langchain4j.ai.gemini.api-key=${GEMINI_API_KEY:replace-with-your-gemini-api-key}
# Chat Model to use
quarkus.langchain4j.ai.gemini.chat-model.model-id=gemini-3.5-flash
quarkus.langchain4j.ai.gemini.timeout=60s
quarkus.langchain4j.ai.gemini.chat-model.log-requests=false
quarkus.langchain4j.ai.gemini.chat-model.log-responses=false

# Generation controls
quarkus.langchain4j.ai.gemini.chat-model.temperature=0.2
quarkus.langchain4j.ai.gemini.chat-model.max-output-tokens=1500
quarkus.langchain4j.ai.gemini.chat-model.top-p=0.9

# ---------------------------------------------------------------------------
# Tool calling (function calling) limits
# ---------------------------------------------------------------------------
# Corta bucles y limita el coste de las invocaciones de tools.
quarkus.langchain4j.ai-service.max-tool-calls-per-response=4
quarkus.langchain4j.ai-service.max-tool-calling-round-trips=5

# Debug de tool calling en dev: registra las peticiones y respuestas al LLM.
%dev.quarkus.langchain4j.ai.gemini.chat-model.log-requests=true
%dev.quarkus.langchain4j.ai.gemini.chat-model.log-responses=true

# ---------------------------------------------------------------------------
# Chat memory
# ---------------------------------------------------------------------------
# Los AI services con tools requieren memoria; acotamos la ventana por sesión.
quarkus.langchain4j.chat-memory.memory-window.max-messages=10

# Reemplazo vigente de text-embedding-004
quarkus.langchain4j.ai.gemini.embedding-model.model-id=gemini-embedding-001
# Alinear dimensión con pgvector (gemini-embedding-001 por defecto da 3072)
quarkus.langchain4j.ai.gemini.embedding-model.output-dimension=1536
quarkus.langchain4j.pgvector.dimension=1536


# %dev.quarkus.langchain4j.pgvector.drop-table-first=true

# ---------------------------------------------------------------------------
# Nominatim geocoding (MicroProfile REST Client, config key "nominatim")
# ---------------------------------------------------------------------------
# URL externalized so the geocoding backend can be swapped without a rebuild
# (required by the Nominatim usage policy).
quarkus.rest-client.nominatim.url=https://nominatim.openstreetmap.org
quarkus.rest-client.nominatim.headers.User-Agent=demo-quarkus-langchaing4j/1.0
quarkus.rest-client.nominatim.headers.Accept-Language=es
quarkus.rest-client.nominatim.connect-timeout=5000
quarkus.rest-client.nominatim.read-timeout=5000

# ---------------------------------------------------------------------------
# Open-Meteo weather (MicroProfile REST Client, config key "open-meteo")
# ---------------------------------------------------------------------------
# No API key required for non-commercial use. Attribution required:
# "Weather data by Open-Meteo.com" (CC BY 4.0).
quarkus.rest-client.open-meteo.url=https://api.open-meteo.com
quarkus.rest-client.open-meteo.headers.User-Agent=demo-quarkus-langchaing4j/1.0
quarkus.rest-client.open-meteo.connect-timeout=5000
quarkus.rest-client.open-meteo.read-timeout=5000

# ---------------------------------------------------------------------------
# RAG (pipeline manual)
# ---------------------------------------------------------------------------
rag.location=src/main/resources/rag
rag.segment-size=300
rag.overlap-size=30
rag.max-results=5
rag.min-score=0.0
rag.reindex-on-startup=true


# Disable the Gemini integration in tests so the test suite runs without a key
%test.quarkus.langchain4j.ai.gemini.enable-integration=false
